version: '3.8'

services:
  backend:
    build:
      context: ./server
    container_name: auto-recurso-backend
    restart: unless-stopped
    volumes:
      - ./server/data.json:/app/data.json
    env_file:
      - ./server/.env
    networks:
      - webapps

  frontend:
    build:
      context: .
    container_name: auto-recurso-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - webapps
    environment:
      - NODE_ENV=production

networks:
  webapps:
    driver: bridge
